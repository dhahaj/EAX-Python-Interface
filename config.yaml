---
app_name: EAX500 Interface
app_version: 1.0.0

firmware:
  default_device: EAX500
  files:
    - basename: EAX300
      filename: EAX300_59.hex
      version: '59'
    - basename: EAX500
      filename: EAX500_591.hex
      version: '591'
    - basename: EAX503
      filename: EAX503_591.hex
      version: '591'
    - basename: EAX504
      filename: EAX504_591.hex
      version: '591'
    - basename: EAX505
      filename: EAX505_591.hex
      version: '591'
    - basename: EAX510
      filename: EAX510_591.hex
      version: '591'
    - basename: EAX513
      filename: EAX513_591.hex
      version: '591'
    - basename: EAX514
      filename: EAX514_591.hex
      version: '591'
    - basename: EAX515
      filename: EAX515_591.hex
      version: '591'
    - basename: EAX520
      filename: EAX520_591.hex
      version: '591'
    - basename: EAX523
      filename: EAX523_591.hex
      version: '591'
    - basename: EAX524
      filename: EAX524_591.hex
      version: '591'
    - basename: EAX525
      filename: EAX525_591.hex
      version: '591'
  path: ./firmware

pins:
  - function: low battery
    io_mode: output
    pin_number: 2
    pullup_enabled: false
  # - function: test mode
  #   io_mode: output
  #   pin_number: 3
  #   pullup_enabled: false
  - function: battery
    io_mode: output
    pin_number: 4
    pullup_enabled: false
  # - function: remote
  #   io_mode: output
  #   pin_number: 5
  #   pullup_enabled: false
  # - function: pad
  #   io_mode: output
  #   pin_number: 6
  #   pullup_enabled: false
  # - function: relay in
  #   io_mode: input_pullup
  #   pin_number: 7
  #   pullup_enabled: true
  # - function: okc
  #   io_mode: output
  #   pin_number: 8
  #   pullup_enabled: false
  # - function: ac
  #   io_mode: output
  #   pin_number: 9
  #   pullup_enabled: false
  - function: indicator
    io_mode: output
    pin_number: 10
    pullup_enabled: false
  # - function: relay1
  #   io_mode: output
  #   pin_number: 11
  #   pullup_enabled: false
  # - function: relay2
  #   io_mode: output
  #   pin_number: 12
  #   pullup_enabled: false
  - function: test indicator
    io_mode: output
    pin_number: 13
    pullup_enabled: false

logging:
  log_file: logs/app_{time:YYYY-MM-DD}.log
  log_level: DEBUG
  log_format: '{time:YYYY-MM-DD HH:mm:ss} | {level} | {file}:{function}:{line} | {message}'
  log_rotation: 00:00
  log_retention: '14 days'
  database_file: logs.db

# defualt settings
settings:
  arduino_instance_id: 1
  arduino_wait: 4
  auto_connect: true
  auto_find: true
  inactivity_timeout: 15
  auto_test: true
  bg_color: '#000000'
  chip_part: PIC16F628A
  debug: true
  fg_color: '#ff5500'
  firmware_folder: firmware
  font_family: Consolas
  font_size: 14
  font_weight: normal
  frameless: false
  full_screen: false
  last_user: dmh
  programmer_serial_number: 1E660
  serial_port: COM30
  shutdown_on_exception: true
  skip_login: false
  sleep_tune: 0.000001
  testing_speed: 2100
  touchscreen_enabled: false
# defines the test sequence

testing:
  - command: digital_write
    delay: 1
    description: Test Indicator On
    params: [13, 1]
  - command: insert_text
    delay: 1
    description: Show Text
    params: ["\n • Battery power on → Siren chirps and both LEDs flash  \n"]
  - command: digital_write
    delay: 1
    description: Battery On
    params: [4, 1]
  - command: insert_text
    delay: null
    description: Show Text
    params: ["\n • Starting low battery test → LEDs flash alternating \n"]
  - command: digital_write
    delay: 1
    description: Low Battery On
    params: [2, 1]
  - command: insert_text
    delay: null
    description: Show Text
    params: ["\n • Low battery test off → LEDs turn off.\n"]
  - command: digital_write
    delay: 1
    description: Low Battery Off
    params: [2, 0]
  - command: insert_text
    delay: 500
    description: Show Text
    params: [" • Perform the following:\n \t1. Press the key switch → The siren sounds\n \t2. Press the cylinder switch → The LEDs turn on\n"]
  - command: insert_text
    delay: 200
    description: Show Text
    params: ["\n\nPress the Continue button to finish testing..."]
  - command: wait_for_button
    delay: 1
    description: Wait for Button
    params: [15000]
  - command: insert_text
    delay: 1
    description: Show Text
    params: ["\n Test complete.\n"]
  - command: digital_write
    delay: 1
    description: Test Indicator Off
    params: [13, 0]
  - command: digital_write
    delay: 1
    description: Battery Off
    params: [4, 0]
  - command: load_instructions
    delay: 10
    description: Load Instructions
    params: [instructions.md]

chip_options:
  - PIC16F627
  - PIC16F627A
  - PIC16F628
  - PIC16F628A